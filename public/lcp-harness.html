// The tool announces itself when it has mounted. Posting on iframe load races
// React and the payload is dropped.
window.addEventListener('message', (e) => {
  if (e.data?.type !== 'lcp:ready') return;
  const w = document.getElementById('f').contentWindow;
  w.postMessage({ type: 'lcp:types', version: 1, types: TYPES }, '*');
  w.postMessage({
    type: 'lcp:init', version: 1, modules: MODULES, links: LINKS, focusZone: FOCUS,
    context: { branchId: REV ? '10359' : '10328', systemSetId: SET, hubRef: FOCUS,
               hubLabel: FOCUS, hubContextType: 'Element' },
  }, '*');
});
